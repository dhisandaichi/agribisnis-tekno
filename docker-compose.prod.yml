# Production di VPS: app Go (API + frontend) di belakang Caddy (HTTPS otomatis Let's Encrypt).
# Pemakaian:
#   cp .env.production.example .env.production   # isi nilainya
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm app -migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  app:
    build: .
    image: agritec-app:latest
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
